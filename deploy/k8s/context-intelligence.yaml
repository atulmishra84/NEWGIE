apiVersion: v1
kind: Namespace
metadata:
  name: gie
  labels:
    app.kubernetes.io/part-of: gie
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: context-intelligence-config
  namespace: gie
  labels:
    app.kubernetes.io/name: context-intelligence
    app.kubernetes.io/component: api
data:
  GIE_ENV: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4317"
  FLAG_ENABLE_CLOUD_SCANNERS: "true"
  SCAN_MAX_FILE_BYTES: "1048576"
  SCAN_MAX_FILES: "10000"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.gie.svc.cluster.local:9092"
  QDRANT_URL: "http://qdrant.gie.svc.cluster.local:6333"
  NEO4J_URI: "bolt://neo4j.gie.svc.cluster.local:7687"
  REDIS_URL: "redis://redis.gie.svc.cluster.local:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: context-intelligence-secrets
  namespace: gie
  labels:
    app.kubernetes.io/name: context-intelligence
type: Opaque
stringData:
  # Replace before deploy — example values only
  DATABASE_URL: "postgresql+asyncpg://gie:CHANGE_ME@postgres.gie.svc.cluster.local:5432/gie_context"
  JWT_SECRET: "replace-with-32-byte-random"
  API_KEY_PEPPER: "replace-with-random-pepper"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "replace-neo4j-password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-intelligence
  namespace: gie
  labels:
    app.kubernetes.io/name: context-intelligence
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: context-intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: context-intelligence
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: context-intelligence
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/gie/context-intelligence:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: context-intelligence-config
            - secretRef:
                name: context-intelligence-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: context-intelligence
  namespace: gie
  labels:
    app.kubernetes.io/name: context-intelligence
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: context-intelligence
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-intelligence
  namespace: gie
  labels:
    app.kubernetes.io/name: context-intelligence
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: context-intelligence
  namespace: gie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: context-intelligence
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: context-intelligence
  namespace: gie
  labels:
    app.kubernetes.io/name: context-intelligence
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: context-intelligence
  namespaceSelector:
    matchNames:
      - gie
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
