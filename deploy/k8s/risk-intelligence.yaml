apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-intelligence
  namespace: gie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-intelligence
  template:
    metadata:
      labels:
        app: risk-intelligence
    spec:
      containers:
        - name: api
          image: gie/risk-intelligence:1.0.0
          ports:
            - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: risk-intelligence
  namespace: gie
spec:
  selector:
    app: risk-intelligence
  ports:
    - port: 8083
      targetPort: 8083
