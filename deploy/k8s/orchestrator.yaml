apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: gie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: api
          image: gie/orchestrator:1.0.0
          ports:
            - containerPort: 8091
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: gie
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8091
      targetPort: 8091
