apiVersion: apps/v1
kind: Deployment
metadata:
  name: explainability-intelligence
  namespace: gie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: explainability-intelligence
  template:
    metadata:
      labels:
        app: explainability-intelligence
    spec:
      containers:
        - name: api
          image: gie/explainability-intelligence:1.0.0
          ports:
            - containerPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: explainability-intelligence
  namespace: gie
spec:
  selector:
    app: explainability-intelligence
  ports:
    - port: 8087
      targetPort: 8087
