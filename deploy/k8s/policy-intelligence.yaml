apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-intelligence
  namespace: gie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-intelligence
  template:
    metadata:
      labels:
        app: policy-intelligence
    spec:
      containers:
        - name: api
          image: gie/policy-intelligence:1.0.0
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: policy-intelligence
  namespace: gie
spec:
  selector:
    app: policy-intelligence
  ports:
    - port: 8082
      targetPort: 8082
