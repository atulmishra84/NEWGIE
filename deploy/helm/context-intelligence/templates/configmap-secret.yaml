apiVersion: v1
kind: Secret
metadata:
  name: {{ include "context-intelligence.fullname" . }}-secrets
  labels:
    {{- include "context-intelligence.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  API_KEY_PEPPER: {{ .Values.secrets.apiKeyPepper | quote }}
  NEO4J_USER: {{ .Values.secrets.neo4jUser | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "context-intelligence.fullname" . }}-config
  labels:
    {{- include "context-intelligence.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
