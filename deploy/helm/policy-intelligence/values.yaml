replicaCount: 1
image:
  repository: gie/policy-intelligence
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8082
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  GIE_ENV: docker
  REQUIRE_AUTH: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
