replicaCount: 1
image:
  repository: gie/knowledge-intelligence
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8081
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
env:
  GIE_ENV: docker
  REQUIRE_AUTH: "false"
  FLAG_ENABLE_REINDEX_ON_START: "true"
  FLAG_ENABLE_GRAPH_EXPANSION: "true"
  QDRANT_COLLECTION: knowledge_embeddings
  KAFKA_BOOTSTRAP_SERVERS: kafka.gie.svc.cluster.local:9092
  QDRANT_URL: http://qdrant.gie.svc.cluster.local:6333
  NEO4J_URI: bolt://neo4j.gie.svc.cluster.local:7687
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
  apiKeyPepper: ""
  neo4jUser: neo4j
  neo4jPassword: ""
