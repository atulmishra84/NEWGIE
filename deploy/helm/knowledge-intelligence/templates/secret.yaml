{{- if or .Values.secrets.databaseUrl .Values.secrets.redisUrl .Values.secrets.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: knowledge-intelligence-secrets
  labels:
    app: knowledge-intelligence
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKeyPepper }}
  API_KEY_PEPPER: {{ .Values.secrets.apiKeyPepper | quote }}
  {{- end }}
  {{- if .Values.secrets.neo4jUser }}
  NEO4J_USER: {{ .Values.secrets.neo4jUser | quote }}
  {{- end }}
  {{- if .Values.secrets.neo4jPassword }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  {{- end }}
{{- end }}
