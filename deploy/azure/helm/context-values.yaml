replicaCount: 1
autoscaling:
  enabled: false
image:
  repository: REPLACE_ACR_LOGIN_SERVER/gie-context-intelligence
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
env:
  GIE_ENV: docker
  REQUIRE_AUTH: "false"
  FLAG_ENABLE_CLOUD_SCANNERS: "false"
  SCAN_MAX_FILE_BYTES: "1048576"
  SCAN_MAX_FILES: "10000"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  KAFKA_BOOTSTRAP_SERVERS: kafka.gie.svc.cluster.local:9092
  QDRANT_URL: http://qdrant.gie.svc.cluster.local:6333
  NEO4J_URI: bolt://neo4j.gie.svc.cluster.local:7687
secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
  apiKeyPepper: ""
  neo4jUser: neo4j
  neo4jPassword: ""
