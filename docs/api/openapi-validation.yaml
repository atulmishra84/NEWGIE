openapi: 3.1.0
info:
  title: GIE Validation Intelligence Agent API
  version: 1.0.0
servers:
  - url: http://localhost:8088
paths:
  /validate:
    post:
      summary: Validate policies before deployment
      responses:
        "200":
          description: ValidationReport
  /simulate:
    post:
      summary: Simulate policy execution
      responses:
        "200":
          description: ValidationReport with simulations
  /validation/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ValidationReport
  /validation/report:
    get:
      summary: Latest validation dashboard/report
      responses:
        "200":
          description: Validation dashboard
