openapi: 3.1.0
info:
  title: GIE Policy Intelligence Agent API
  version: 1.0.0
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
  /v1/policies/generate:
    post:
      summary: Generate deployment-ready policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: PolicyDecision
  /v1/policies/decisions/{decision_id}/explain:
    get:
      parameters:
        - name: decision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Explanation
