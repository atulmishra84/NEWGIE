openapi: 3.1.0
info:
  title: GIE Risk Intelligence Agent API
  version: 1.0.0
servers:
  - url: http://localhost:8083
paths:
  /risk/calculate:
    post:
      summary: Calculate AI risk posture
      responses:
        "200":
          description: RiskReport
  /risk/recalculate:
    post:
      summary: Dynamically recalculate risk
      responses:
        "200":
          description: RiskReport
  /risk/{agentId}:
    get:
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest RiskReport
  /risk/history:
    get:
      responses:
        "200":
          description: Risk history
  /risk/remediation:
    get:
      parameters:
        - name: agent_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Remediation actions
