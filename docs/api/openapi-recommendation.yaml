openapi: 3.1.0
info:
  title: GIE Recommendation Intelligence Agent API
  version: 1.0.0
servers:
  - url: http://localhost:8085
paths:
  /recommendations:
    post:
      summary: Generate prioritized recommendations
      responses:
        "200":
          description: RecommendationReport
  /recommendations/{agentId}:
    get:
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest RecommendationReport
  /recommendations/history:
    get:
      responses:
        "200":
          description: Recommendation history
  /recommendations/approve:
    post:
      summary: Approve recommendations
      responses:
        "200":
          description: Updated RecommendationReport
