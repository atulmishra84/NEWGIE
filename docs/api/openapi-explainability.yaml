openapi: 3.1.0
info:
  title: GIE Explainability Intelligence Agent API
  version: 1.0.0
servers:
  - url: http://localhost:8087
paths:
  /explain:
    post:
      summary: Explain a decision
      responses:
        "200":
          description: ExplanationReport
  /explanation/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ExplanationReport
  /reasoning/path:
    post:
      summary: Build reasoning path and diagram
      responses:
        "200":
          description: Reasoning path + mermaid/figma payload
  /figma-generate-diagram:
    get:
      summary: FigJam generate_diagram payload
      parameters:
        - name: explanation_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: generate_diagram payload with mermaidSyntax
