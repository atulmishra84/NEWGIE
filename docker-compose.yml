services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gie
      POSTGRES_PASSWORD: gie
      POSTGRES_DB: gie_context
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/giepassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: gieMkT4yT_m-dqoEzBqxbA

  context-intelligence:
    build:
      context: .
      dockerfile: agents/context-intelligence/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GIE_ENV: local
      DATABASE_URL: postgresql+asyncpg://gie:gie@postgres:5432/gie_context
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: giepassword
      QDRANT_URL: http://qdrant:6333
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      FLAG_ENABLE_CLOUD_SCANNERS: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
      kafka:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: agents/context-intelligence/Dockerfile
    command: ["celery", "-A", "context_intelligence.infrastructure.celery_app.app", "worker", "-l", "INFO", "-Q", "scans"]
    environment:
      GIE_ENV: local
      DATABASE_URL: postgresql+asyncpg://gie:gie@postgres:5432/gie_context
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: giepassword
      QDRANT_URL: http://qdrant:6333
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      FLAG_ENABLE_CLOUD_SCANNERS: "false"
    depends_on:
      - context-intelligence
      - redis
      - postgres

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
