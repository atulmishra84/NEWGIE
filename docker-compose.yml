  orchestrator:
    build:
      context: .
      dockerfile: agents/orchestrator/Dockerfile
    ports:
      - "8091:8091"
    environment:
      GIE_ENV: docker
      DATABASE_URL: postgresql+asyncpg://gie:gie@postgres:5432/gie_orchestrator?ssl=disable
      REDIS_URL: redis://redis:6379/11
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      REQUIRE_AUTH: "false"
      SIMULATE_AGENTS: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      CONTEXT_URL: http://context-intelligence:8080
      KNOWLEDGE_URL: http://knowledge-intelligence:8081
      POLICY_URL: http://policy-intelligence:8082
      RISK_URL: http://risk-intelligence:8083
      COMPLIANCE_URL: http://compliance-intelligence:8084
      RECOMMENDATION_URL: http://recommendation-intelligence:8085
      GENERATOR_URL: http://policy-generator:8086
      EXPLAINABILITY_URL: http://explainability-intelligence:8087
      VALIDATION_URL: http://validation-intelligence:8088
      LEARNING_URL: http://learning-intelligence:8089
      INTEGRATION_URL: http://integration-intelligence:8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      context-intelligence:
        condition: service_started
      knowledge-intelligence:
        condition: service_started
      policy-intelligence:
        condition: service_started
      risk-intelligence:
        condition: service_started
      compliance-intelligence:
        condition: service_started
      recommendation-intelligence:
        condition: service_started
      policy-generator:
        condition: service_started
      explainability-intelligence:
        condition: service_started
      validation-intelligence:
        condition: service_started
      learning-intelligence:
        condition: service_started
      integration-intelligence:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - orchestrator

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
