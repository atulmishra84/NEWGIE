      - "8085:8085"
    environment:
      GIE_ENV: docker
      DATABASE_URL: postgresql+asyncpg://gie:gie@postgres:5432/gie_recommendation?ssl=disable
      REDIS_URL: redis://redis:6379/5
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      REQUIRE_AUTH: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  policy-generator:
    build:
      context: .
      dockerfile: agents/policy-generator/Dockerfile
    ports:
      - "8086:8086"
    environment:
      GIE_ENV: docker
      DATABASE_URL: postgresql+asyncpg://gie:gie@postgres:5432/gie_policygen?ssl=disable
      REDIS_URL: redis://redis:6379/6
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      REQUIRE_AUTH: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
