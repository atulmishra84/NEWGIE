[project]
name = "gie-context-sdk"
version = "1.0.0"
description = "Python SDK for GIE Context Intelligence Agent"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "gie-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gie_context_sdk"]

[tool.uv.sources]
gie-contracts = { workspace = true }
