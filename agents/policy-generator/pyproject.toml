[project]
name = "policy-generator"
version = "1.0.0"
description = "Policy Generator Agent — convert recommendations into deployment-ready policies"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "celery>=5.4",
  "aiokafka>=0.10",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "prometheus-client>=0.20",
  "gie-contracts",
  "gie-observability",
  "gie-security",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27", "PyJWT>=2.8"]
[project.scripts]
gie-policygen = "policy_generator.adapters.cli.main:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/policy_generator"]
[tool.uv.sources]
gie-contracts = { path = "../../packages/gie-contracts", editable = true }
gie-observability = { path = "../../packages/gie-observability", editable = true }
gie-security = { path = "../../packages/gie-security", editable = true }
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
