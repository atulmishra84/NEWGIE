[project]
name = "context-intelligence"
version = "1.0.0"
description = "Context Intelligence Agent — scans AI projects into normalized context models"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "neo4j>=5.20",
  "qdrant-client>=1.9",
  "celery>=5.4",
  "aiokafka>=0.10",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "gitpython>=3.1",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
  "rich>=13.7",
  "typer>=0.12",
  "prometheus-client>=0.20",
  "gie-contracts",
  "gie-observability",
  "gie-security",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "pyyaml>=6.0",
  "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_intelligence"]

[tool.uv.sources]
gie-contracts = { path = "../../packages/gie-contracts", editable = true }
gie-observability = { path = "../../packages/gie-observability", editable = true }
gie-security = { path = "../../packages/gie-security", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
