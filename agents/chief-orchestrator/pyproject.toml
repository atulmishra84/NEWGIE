[project]
name = "chief-orchestrator"
version = "1.0.0"
description = "Chief Orchestrator — text+voice front door for Full+GIE fleet"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "gie-contracts",
  "boto3>=1.34",
  "gie-llm",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chief_orchestrator"]

[tool.uv.sources]
gie-contracts = { path = "../../packages/gie-contracts", editable = true }
gie-llm = { path = "../../packages/gie-llm", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
