[project]
name = "policy-engine"
version = "1.0.0"
description = "GIE Policy Engine Agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.3",
  "gie-contracts",
  "boto3>=1.34",
  "gie-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_engine"]

[tool.uv.sources]
gie-contracts = { path = "../../packages/gie-contracts", editable = true }
gie-llm = { path = "../../packages/gie-llm", editable = true }
