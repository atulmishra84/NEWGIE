name: CI

on:
  push:
    branches: [main, develop, "cursor/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: |
          pip install ruff mypy
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install ./agents/context-intelligence ./agents/knowledge-intelligence ./agents/policy-intelligence ./agents/risk-intelligence ./agents/compliance-intelligence ./agents/recommendation-intelligence ./agents/policy-generator ./agents/explainability-intelligence ./agents/validation-intelligence ./agents/learning-intelligence ./agents/integration-intelligence ./agents/orchestrator

      - name: Ruff check
        run: ruff check agents packages

      - name: Ruff format check
        run: ruff format --check agents packages

  test-context:
    name: Test Context Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/context-intelligence[dev]"
      - name: Pytest
        working-directory: agents/context-intelligence
        run: pytest tests/ -q

  test-knowledge:
    name: Test Knowledge Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/knowledge-intelligence[dev]"
      - name: Pytest
        working-directory: agents/knowledge-intelligence
        run: pytest tests/ -q

  test-policy:
    name: Test Policy Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/policy-intelligence[dev]"
      - name: Pytest
        working-directory: agents/policy-intelligence
        run: pytest tests/ -q

  test-risk:
    name: Test Risk Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/risk-intelligence[dev]"
      - name: Pytest
        working-directory: agents/risk-intelligence
        run: pytest tests/ -q

  test-compliance:
    name: Test Compliance Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/compliance-intelligence[dev]"
      - name: Pytest
        working-directory: agents/compliance-intelligence
        run: pytest tests/ -q

  test-recommendation:
    name: Test Recommendation Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/recommendation-intelligence[dev]"
      - name: Pytest
        working-directory: agents/recommendation-intelligence
        run: pytest tests/ -q

  test-policy-generator:
    name: Test Policy Generator
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/policy-generator[dev]"
      - name: Pytest
        working-directory: agents/policy-generator
        run: pytest tests/ -q

  test-explainability:
    name: Test Explainability Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/explainability-intelligence[dev]"
      - name: Pytest
        working-directory: agents/explainability-intelligence
        run: pytest tests/ -q

  test-validation:
    name: Test Validation Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/validation-intelligence[dev]"
      - name: Pytest
        working-directory: agents/validation-intelligence
        run: pytest tests/ -q

  test-learning:
    name: Test Learning Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/learning-intelligence[dev]"
      - name: Pytest
        working-directory: agents/learning-intelligence
        run: pytest tests/ -q

  test-integration:
    name: Test Integration Intelligence
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/integration-intelligence[dev]"
      - name: Pytest
        working-directory: agents/integration-intelligence
        run: pytest tests/ -q

  test-orchestrator:
    name: Test Orchestrator
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install ./packages/gie-contracts ./packages/gie-observability ./packages/gie-security
          pip install "./agents/orchestrator[dev]"
      - name: Pytest
        working-directory: agents/orchestrator
        run: pytest tests/ -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test-context, test-knowledge, test-policy, test-risk, test-compliance, test-recommendation, test-policy-generator, test-explainability, test-validation, test-learning, test-integration, test-orchestrator]
    strategy:
      matrix:
        agent: [context-intelligence, knowledge-intelligence, policy-intelligence, risk-intelligence, compliance-intelligence, recommendation-intelligence, policy-generator, explainability-intelligence, validation-intelligence, learning-intelligence, integration-intelligence, orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/${{ matrix.agent }}/Dockerfile
          push: false
          tags: gie/${{ matrix.agent }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm/context-intelligence
          helm lint deploy/helm/knowledge-intelligence
          helm lint deploy/helm/policy-intelligence
          helm lint deploy/helm/risk-intelligence
          helm lint deploy/helm/compliance-intelligence
          helm lint deploy/helm/recommendation-intelligence
          helm lint deploy/helm/policy-generator
          helm lint deploy/helm/explainability-intelligence
          helm lint deploy/helm/validation-intelligence
          helm lint deploy/helm/learning-intelligence
          helm lint deploy/helm/integration-intelligence
          helm lint deploy/helm/orchestrator

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
      - working-directory: deploy/terraform
        run: |
          terraform init -backend=false
          terraform validate
