    ports: !reset []
    environment:
      GIE_ENV: docker
      DATABASE_URL: postgresql+asyncpg://gie:gie@127.0.0.1:5432/gie_knowledge?ssl=disable
      REDIS_URL: redis://127.0.0.1:6379/1
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: giepassword
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: knowledge_embeddings
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      REQUIRE_AUTH: "false"
      FLAG_ENABLE_REINDEX_ON_START: "true"
