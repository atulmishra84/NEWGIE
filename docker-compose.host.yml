# Override for environments where Docker bridge networking is broken.
# Usage: docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
#
# All services share the host network namespace and talk over 127.0.0.1.

services:
  postgres:
    network_mode: host
    ports: !reset []

  redis:
    network_mode: host
    ports: !reset []

  neo4j:
    network_mode: host
    ports: !reset []

  qdrant:
    network_mode: host
    ports: !reset []

  kafka:
    network_mode: host
    ports: !reset []
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: gieLocalKafkaCluster01

  context-intelligence:
    network_mode: host
    ports: !reset []
    environment:
      GIE_ENV: docker
      DATABASE_URL: postgresql+asyncpg://gie:gie@127.0.0.1:5432/gie_context?ssl=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: giepassword
      QDRANT_URL: http://127.0.0.1:6333
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      FLAG_ENABLE_CLOUD_SCANNERS: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      REQUIRE_AUTH: "false"

  worker:
    network_mode: host
    environment:
      GIE_ENV: docker
      DATABASE_URL: postgresql+asyncpg://gie:gie@127.0.0.1:5432/gie_context?ssl=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: giepassword
      QDRANT_URL: http://127.0.0.1:6333
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      JWT_SECRET: local-dev-secret-change-me
      API_KEY_PEPPER: local-pepper
      FLAG_ENABLE_CLOUD_SCANNERS: "false"
      REQUIRE_AUTH: "false"

  knowledge-intelligence:
