  web:
    network_mode: host
    ports: !reset []
    # nginx listens on 80 by default — remap via custom command
    command: ["nginx", "-g", "daemon off;"]
    # use a host-side port via sed in entry — keep 5173 by overriding conf at runtime
    volumes:
      - ./web/nginx-host.conf:/etc/nginx/conf.d/default.conf:ro
