server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy so the dashboard works on Azure without typing the
  # Orchestrator LoadBalancer URL (also avoids mixed-content / CORS footguns).
  location /api/ {
    proxy_pass http://gie-orchestrator.gie.svc.cluster.local:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store";
    return 200 'window.GIE_API_BASE="/api";window.GIE_DEMO={"tenant":"acme","path":"/demo/acme-ai-assistant"};';
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
